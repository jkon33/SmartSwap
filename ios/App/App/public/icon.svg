<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="smartSwapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with safe zone margins -->
  <rect width="512" height="512" rx="112" fill="url(#smartSwapGrad)" />
  
  <!-- Central Icon (inside safe zone circle) -->
  <g filter="url(#shadow)" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Swap Arrow -->
    <path d="M 160 210 L 330 210 M 275 155 L 330 210 L 275 265" />
    <!-- Bottom Swap Arrow -->
    <path d="M 352 302 L 182 302 M 237 357 L 182 302 L 237 247" />
  </g>
  
  <!-- Central Currency Dot Accents -->
  <circle cx="160" cy="210" r="14" fill="#60a5fa" />
  <circle cx="352" cy="302" r="14" fill="#93c5fd" />
</svg>
